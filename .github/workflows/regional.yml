name: Resultados Regional Amateur

# Lee las rondas eliminatorias del Torneo Regional Federal Amateur en ascensodelinterior.com.ar
# y actualiza src/data/regional-llaves.json.
on:
  schedule:
    - cron: '47 4,16 * * *'   # 01:47 y 13:47 en Argentina
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/adi/regional.mjs, .github/workflows/regional.yml]

permissions:
  contents: write

concurrency: adi

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/adi/regional.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/regional-llaves.json
          git diff --cached --quiet || git commit -m "Regional: resultados actualizados"
          git pull --rebase -q && git push
