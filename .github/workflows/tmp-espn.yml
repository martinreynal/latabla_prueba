name: Explorar ESPN (temporal)
on:
  push:
    branches: [main]
    paths: [scripts/tmp/espn.sh, .github/workflows/tmp-espn.yml]
permissions:
  contents: write
concurrency: tmp-espn
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/tmp/espn.sh > explorar-espn-salida.txt 2>&1; cat explorar-espn-salida.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add explorar-espn-salida.txt && git commit -qm "Exploración ESPN" && git pull --rebase -q && git push
