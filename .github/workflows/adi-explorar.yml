name: Explorar Ascenso del Interior
on:
  push:
    branches: [main]
    paths: [scripts/adi/explorar.sh, .github/workflows/adi-explorar.yml]
permissions:
  contents: write
concurrency: afa
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/adi/explorar.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add explorar-adi && git commit -qm "Exploración Ascenso del Interior" && git pull --rebase -q && git push
