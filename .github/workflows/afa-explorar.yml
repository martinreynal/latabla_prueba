name: Explorar AFA
on:
  push:
    branches: [afa-explorar]
    paths: [explorar/bajar.sh, .github/workflows/afa-explorar.yml]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash explorar/bajar.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add explorar && git commit -qm "Exploración AFA" && git push
