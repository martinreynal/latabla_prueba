name: Bajar escudos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/bajar-escudos.mjs
      - .github/workflows/escudos.yml

permissions:
  contents: write

jobs:
  escudos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/bajar-escudos.mjs
      - name: Subir los escudos al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/escudos src/data/escudos.json
          git diff --cached --quiet || git commit -m "Escudos: descarga automática"
          git pull --rebase -q && git push
